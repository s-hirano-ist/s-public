name: terraform-apply

on:
  push:
    branches:
      - main
    paths:
      - "terraform/**"
      - "package.json"

jobs:
  apply:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 15
    concurrency:
      group: terraform-apply-main
      cancel-in-progress: false
    env:
      TF_CLOUD_ORGANIZATION: ${{ vars.TF_CLOUD_ORGANIZATION }}
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      TF_WORKSPACE: ${{ vars.TF_WORKSPACE }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install tools via mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install_args: doppler terraform

      - name: Check required configuration
        shell: bash
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        run: |
          set -euo pipefail

          : "${DOPPLER_TOKEN:?Set the DOPPLER_TOKEN repository secret}"
          : "${TF_CLOUD_ORGANIZATION:?Set the TF_CLOUD_ORGANIZATION repository variable}"
          : "${TF_WORKSPACE:?Set the TF_WORKSPACE repository variable}"

      - name: Check Terraform formatting
        run: terraform -chdir=terraform fmt -check

      - name: Initialize Terraform
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        run: doppler run --project s-public --config infra -- terraform -chdir=terraform init -input=false

      - name: Validate Terraform
        run: terraform -chdir=terraform validate

      - name: Apply Terraform changes
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        run: |
          doppler run --project s-public --config infra -- \
            terraform -chdir=terraform apply -auto-approve -input=false -no-color
