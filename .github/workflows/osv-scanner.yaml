name: osv-scanner
on:
  push:
    branches: [main]
    paths:
      - bun.lock
      - package.json
      - mise.toml
  schedule:
    - cron: "0 23 * * 1"
  workflow_dispatch:
jobs:
  scan:
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
    with:
      scan-args: |-
        --lockfile=./bun.lock
        --recursive
        ./
