name: osv-scanner
on:
  push:
    branches: [main]
    paths:
      - bun.lock
      - package.json
      - mise.toml
  schedule:
    - cron: "0 23 * * 1"
  workflow_dispatch:
jobs:
  scan:
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@8deb546fdb875b9996d27d4950be7312dac076a1 # v2.5.0
    with:
      scan-args: |-
        --lockfile=./bun.lock
        --recursive
        ./
