name: osv-scanner
on:
  push:
    branches: [main]
    paths:
      - bun.lock
      - package.json
      - mise.toml
  schedule:
    - cron: "0 23 * * 1"
  workflow_dispatch:
jobs:
  scan:
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@6e4298ebc4db23e847df9b2e2de2939d6f066c67 # v2.5.1
    with:
      scan-args: |-
        --lockfile=./bun.lock
        --recursive
        ./
